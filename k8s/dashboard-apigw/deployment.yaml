apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsdashboard-dashboard-apigw
  namespace: devops-dashboard
  labels:
    app: dashboard-apigw
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-apigw
  template:
    metadata:
      labels:
        app: dashboard-apigw
    spec:
      containers:
        - name: dashboard-apigw
          image: devopsdashboard-dashboard-apigw:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: dashboard-apigw-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-apigw-service
  namespace: devops-dashboard
spec:
  selector:
    app: dashboard-apigw
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
